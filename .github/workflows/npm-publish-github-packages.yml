name: Project verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Install FFmpeg for real media regression tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'lmd-ffmpeg.zip'
          $extracted = Join-Path $env:RUNNER_TEMP 'lmd-ffmpeg'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          $binary = Get-ChildItem -LiteralPath $extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'FFmpeg archive has no ffmpeg.exe' }
          New-Item -ItemType Directory -Path tools/ffmpeg/bin -Force | Out-Null
          Copy-Item -LiteralPath $binary.FullName -Destination tools/ffmpeg/bin/ffmpeg.exe
          Copy-Item -LiteralPath (Join-Path $binary.DirectoryName 'ffprobe.exe') -Destination tools/ffmpeg/bin/ffprobe.exe
      - run: pnpm run build
      - name: Run tests with a physical temporary directory
        shell: pwsh
        run: |
          # Windows runner temp paths can be aliases. Source safety checks require the physical path.
          $testTemp = Join-Path $env:RUNNER_TEMP 'lmd-tests'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          $physicalTemp = node -p "require('node:fs').realpathSync.native(process.argv[1])" $testTemp
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the test temporary directory' }
          $env:TEMP = $physicalTemp
          $env:TMP = $physicalTemp
          $resolvedTemp = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0 -or $resolvedTemp -ine $physicalTemp) { throw 'Test temporary directory is not physical' }
          Write-Host "Test temporary directory: $physicalTemp"
          pnpm run test:all
